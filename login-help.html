<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Help - Channel Partner Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 50px 0;
        }
        .help-card {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .card-header h2 {
            margin: 0;
            font-weight: 700;
        }
        .card-body {
            padding: 40px;
        }
        .form-control {
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
        }
        .btn-check {
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            font-weight: 600;
        }
        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-create {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.3);
        }
        .alert-credentials {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        .alert-error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        .alert-warning {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        .credentials-box {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .credential-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .credential-item:last-child {
            border-bottom: none;
        }
        .credential-label {
            font-weight: 600;
        }
        .credential-value {
            font-family: monospace;
            font-size: 18px;
        }
        .spinner-border-sm {
            width: 1.5rem;
            height: 1.5rem;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
    <link href="css/sidebar.css" rel="stylesheet">
</head>
<body>
    <!-- Mobile Toggle -->
    <button class="sidebar-mobile-toggle" onclick="toggleAdminSidebar()">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleAdminSidebar()"></div>

    <!-- Left Sidebar -->
    <div class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <img src="/logo.jpg" alt="Logo" height="42" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2242%22 height=%2242%22%3E%3Crect fill=%22%234f46e5%22 width=%2242%22 height=%2242%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2220%22%3EI%3C/text%3E%3C/svg%3E';">
            <div class="admin-sidebar-brand">Instantlly<br><span>Admin Dashboard</span></div>
        </div>
        <nav class="admin-sidebar-nav">
            <a class="admin-sidebar-link " href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a class="admin-sidebar-link " href="ads.html"><i class="fas fa-bullhorn"></i> Ads Management</a>
            <a class="admin-sidebar-link " href="users.html"><i class="fas fa-users"></i> Users</a>
            <a class="admin-sidebar-link " href="credits.html"><i class="fas fa-coins"></i> Credits</a>
            <a class="admin-sidebar-link " href="promotions.html"><i class="fas fa-star"></i> Promotions</a>
            <a class="admin-sidebar-link " href="payment-plans.html"><i class="fas fa-dollar-sign"></i> Payment Plans</a>
            <a class="admin-sidebar-link " href="locations.html"><i class="fas fa-map-marker-alt"></i> Locations</a>
            <a class="admin-sidebar-link active" href="login-help.html"><i class="fas fa-life-ring"></i> Login Help</a>
        </nav>
        <div class="admin-sidebar-footer">
            <button class="admin-sidebar-link w-100" id="logoutBtn" style="color:#f87171;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="admin-main">
    <div class="container">
        <div class="help-card">
            <div class="card-header">
                <i class="fas fa-user-shield fa-3x mb-3"></i>
                <h2>Login Help Center</h2>
                <p class="mb-0">Check Your Account Status</p>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <label for="phoneInput" class="form-label">
                        <i class="fas fa-phone"></i> Enter Your Phone Number
                    </label>
                    <input type="tel" 
                           class="form-control" 
                           id="phoneInput" 
                           placeholder="Enter 10-digit phone number"
                           maxlength="10"
                           pattern="[0-9]{10}">
                    <div class="form-text">Enter the phone number you used for application</div>
                </div>

                <button class="btn btn-primary btn-check w-100" onclick="checkAccount()">
                    <i class="fas fa-search"></i> Check Account Status
                </button>

                <div id="resultArea"></div>
            </div>
        </div>

        <div class="back-link">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i> Back to Admin Login
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script>
        async function checkAccount() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultArea = document.getElementById('resultArea');

            // Validation
            if (!phone || phone.length !== 10 || !/^\d{10}$/.test(phone)) {
                resultArea.innerHTML = `
                    <div class="alert alert-error mt-3">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>Invalid Phone Number</strong>
                        <p class="mb-0">Please enter a valid 10-digit phone number</p>
                    </div>
                `;
                return;
            }

            // Show loading
            resultArea.innerHTML = `
                <div class="alert alert-warning mt-3 text-center">
                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                    <strong>Checking account status...</strong>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}/check-user-account`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ phone })
                });

                const data = await response.json();

                if (data.accountExists) {
                    // Account exists - show credentials
                    resultArea.innerHTML = `
                        <div class="alert alert-credentials">
                            <i class="fas fa-check-circle fa-2x mb-3"></i>
                            <h4>✅ Your Account Exists!</h4>
                            <p>Your login credentials are:</p>
                            
                            <div class="credentials-box">
                                <div class="credential-item">
                                    <span class="credential-label">Phone Number:</span>
                                    <span class="credential-value">${data.phone}</span>
                                </div>
                                <div class="credential-item">
                                    <span class="credential-label">Password:</span>
                                    <span class="credential-value">${data.password}</span>
                                </div>
                            </div>

                            <div class="mt-3">
                                <small><i class="fas fa-info-circle"></i> Use these credentials to login to the Channel Partner Portal</small>
                            </div>

                            <a href="../instantllychannelpatner-main/frontend/login.html" class="btn btn-light w-100 mt-3">
                                <i class="fas fa-sign-in-alt"></i> Go to Login Page
                            </a>
                        </div>
                    `;
                } else if (data.applicationExists) {
                    // Application exists but account not created
                    resultArea.innerHTML = `
                        <div class="alert alert-error">
                            <i class="fas fa-exclamation-circle fa-2x mb-3"></i>
                            <h4>⚠️ Technical Issue Detected</h4>
                            <p>Your application was approved on <strong>${new Date(data.approvalDate).toLocaleDateString()}</strong>, but your account was not created due to a technical issue.</p>
                            
                            <div class="credentials-box">
                                <div class="credential-item">
                                    <span class="credential-label">Name:</span>
                                    <span class="credential-value">${data.name}</span>
                                </div>
                                <div class="credential-item">
                                    <span class="credential-label">Phone:</span>
                                    <span class="credential-value">${data.phone}</span>
                                </div>
                                <div class="credential-item">
                                    <span class="credential-label">Position:</span>
                                    <span class="credential-value">${data.position}</span>
                                </div>
                            </div>

                            <button class="btn btn-create w-100 mt-3" onclick="createAccount('${phone}')">
                                <i class="fas fa-user-plus"></i> Create My Account Now
                            </button>
                            
                            <div class="mt-3">
                                <small><i class="fas fa-info-circle"></i> Your account will be created automatically with all your application data including photo</small>
                            </div>
                        </div>
                    `;
                } else {
                    // No application found
                    resultArea.innerHTML = `
                        <div class="alert alert-error">
                            <i class="fas fa-times-circle fa-2x mb-3"></i>
                            <h4>❌ No Application Found</h4>
                            <p>We couldn't find any application with phone number <strong>${phone}</strong></p>
                            
                            <div class="mt-3">
                                <small><i class="fas fa-info-circle"></i> Please check:</small>
                                <ul class="mt-2 mb-0">
                                    <li>Phone number is correct</li>
                                    <li>Application has been submitted and approved</li>
                                    <li>Contact admin if you believe this is an error</li>
                                </ul>
                            </div>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error checking account:', error);
                resultArea.innerHTML = `
                    <div class="alert alert-error mt-3">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>Connection Error</strong>
                        <p class="mb-0">Unable to connect to server. Please try again later.</p>
                    </div>
                `;
            }
        }

        async function createAccount(phone) {
            const resultArea = document.getElementById('resultArea');

            // Show loading
            resultArea.innerHTML = `
                <div class="alert alert-warning mt-3 text-center">
                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                    <strong>Creating your account...</strong>
                    <p class="mb-0 mt-2">This may take a few seconds. Please wait...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}/auto-create-user-account`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ phone })
                });

                const data = await response.json();

                if (data.success) {
                    // Account created successfully
                    resultArea.innerHTML = `
                        <div class="alert alert-credentials">
                            <i class="fas fa-check-circle fa-3x mb-3"></i>
                            <h4>🎉 Account Created Successfully!</h4>
                            <p>Your Channel Partner account has been created with all your data including photo.</p>
                            
                            <div class="credentials-box">
                                <div class="credential-item">
                                    <span class="credential-label">Phone Number:</span>
                                    <span class="credential-value">${data.phone}</span>
                                </div>
                                <div class="credential-item">
                                    <span class="credential-label">Password:</span>
                                    <span class="credential-value">${data.password}</span>
                                </div>
                            </div>

                            <div class="mt-3 alert alert-warning" style="background: rgba(255,255,255,0.3); border: none;">
                                <i class="fas fa-key"></i> <strong>Important:</strong> Please save these credentials. Your password is generated from the first 4 letters of your name.
                            </div>

                            <a href="../instantllychannelpatner-main/frontend/login.html" class="btn btn-light w-100 mt-3">
                                <i class="fas fa-sign-in-alt"></i> Go to Login Page
                            </a>
                        </div>
                    `;
                } else {
                    resultArea.innerHTML = `
                        <div class="alert alert-error">
                            <i class="fas fa-exclamation-triangle"></i>
                            <strong>Account Creation Failed</strong>
                            <p>${data.message || 'Unable to create account. Please contact admin.'}</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error creating account:', error);
                resultArea.innerHTML = `
                    <div class="alert alert-error mt-3">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>Connection Error</strong>
                        <p class="mb-0">Unable to create account. Please try again later or contact admin.</p>
                    </div>
                `;
            }
        }

        // Allow Enter key to submit
        document.getElementById('phoneInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAccount();
            }
        });

        // Auto-focus phone input
        window.addEventListener('load', function() {
            document.getElementById('phoneInput').focus();
        });
    </script>
    </div><!-- end admin-main -->

    <script>
    function toggleAdminSidebar() {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarBackdrop').classList.toggle('show');
    }
    // Logout button
    const lb = document.getElementById('logoutBtn');
    if (lb) lb.addEventListener('click', () => { localStorage.clear(); window.location.href='index.html'; });
    </script>
</body>
</html>
