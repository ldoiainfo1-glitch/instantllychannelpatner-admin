<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Plans Management - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px 0;
        }
        .container { max-width: 1600px; }
        .page-header {
            background: white;
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .page-header h2 { font-size: 18px; margin-bottom: 5px; }
        .page-header p { font-size: 12px; margin-bottom: 0; }
        .tier-section {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .tier-section-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tier-section-header h4 { font-size: 14px; margin: 0; }
        .plan-card {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            position: relative;
            transition: all 0.2s;
            background: #f8f9fa;
        }
        .plan-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        .plan-number {
            position: absolute;
            top: -10px;
            left: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .investment-section {
            text-align: center;
            padding: 8px;
            background: white;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #e9ecef;
        }
        .investment-label {
            font-size: 9px;
            text-transform: uppercase;
            color: #6c757d;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .investment-input {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            border: none;
            background: transparent;
            color: #2d3748;
            width: 100%;
            padding: 4px;
        }
        .investment-input:focus {
            outline: none;
        }
        .benefits-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .benefit-box {
            background: white;
            border-radius: 6px;
            padding: 8px;
            border: 1px solid #e9ecef;
        }
        .benefit-box.profit {
            border-left: 3px solid #10b981;
        }
        .benefit-box.credits {
            border-left: 3px solid #8b5cf6;
        }
        .benefit-header {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .benefit-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 6px;
            font-size: 11px;
        }
        .benefit-icon.profit {
            background: #d1fae5;
            color: #10b981;
        }
        .benefit-icon.credits {
            background: #ede9fe;
            color: #8b5cf6;
        }
        .benefit-label {
            font-size: 9px;
            color: #6c757d;
            text-transform: uppercase;
            font-weight: 600;
            line-height: 1.2;
        }
        .benefit-sublabel {
            font-size: 8px;
            color: #9ca3af;
        }
        .benefit-value input {
            font-size: 16px;
            font-weight: 700;
            border: none;
            background: transparent;
            width: 100%;
            padding: 2px;
        }
        .benefit-value input:focus {
            outline: none;
            background: #f0f9ff;
            border-radius: 3px;
        }
        .visibility-section {
            background: #e0e7ff;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .visibility-header {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 6px;
            font-size: 10px;
        }
        .visibility-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .visibility-check {
            background: white;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            user-select: none;
        }
        .visibility-check:hover {
            border-color: #667eea;
            background: #f0f9ff;
        }
        .visibility-check input[type="checkbox"] {
            cursor: pointer;
            width: 14px;
            height: 14px;
        }
        .visibility-check:has(input[type="checkbox"]:checked) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .visibility-check:has(input[type="checkbox"]:checked):hover {
            background: #5568d3;
            border-color: #5568d3;
        }
        .action-buttons {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .btn-remove {
            flex: 1;
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            font-weight: 600;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 11px;
        }
        .btn-remove:hover {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
        }
        .btn-add-plan {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
            padding: 6px 15px;
            border-radius: 6px;
            transition: transform 0.2s;
            font-size: 12px;
        }
        .btn-add-plan:hover {
            transform: scale(1.05);
            color: white;
        }
        .btn-save-all {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-save-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
            color: white;
        }
        .navbar {
            background: white !important;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            padding: 8px 0;
        }
        .navbar-brand { font-size: 14px; }
        .btn-outline-danger { font-size: 12px; padding: 6px 15px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="fas fa-dollar-sign me-2 text-primary"></i>
                <span style="color: #667eea;">Payment Plans Manager</span>
            </a>
            <div class="d-flex">
                <button class="btn btn-outline-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2 class="mb-2">
                <i class="fas fa-credit-card me-2 text-primary"></i>
                Payment Plans Management
            </h2>
            <p class="text-muted mb-0">
                <i class="fas fa-info-circle me-2"></i>
                Design your payment plans with prices, profits, and credits. Use checkboxes to control which locations see each plan.
            </p>
        </div>

        <!-- Single Unified Plans Section -->
        <div class="tier-section">
            <div class="tier-section-header">
                <h4 class="mb-0"><i class="fas fa-rupee-sign me-2"></i>All Payment Plans</h4>
                <button class="btn btn-add-plan btn-sm" onclick="addPlan()">
                    <i class="fas fa-plus me-2"></i>Add New Plan
                </button>
            </div>
            <div class="row" id="all-plans"></div>
        </div>

        <!-- Save Button -->
        <div class="text-center mt-5 mb-5">
            <button class="btn btn-save-all" onclick="saveAllPlans()">
                <i class="fas fa-save me-2"></i>SAVE ALL CHANGES
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script>
        const API_BASE_URL = ADMIN_CONFIG.getApiBaseUrl();
        const allLevels = ['India', 'Zone', 'State', 'Division', 'District', 'Tehsil', 'Pincode', 'Village'];

        // Single unified array of payment plans with visibility control
        let paymentPlans = [
            { pay: 90000, profit: 510000, credit: 600000, visibleFor: allLevels },
            { pay: 75000, profit: 425000, credit: 500000, visibleFor: ['State', 'Division', 'District', 'Tehsil', 'Pincode', 'Village'] },
            { pay: 60000, profit: 340000, credit: 400000, visibleFor: ['District', 'Tehsil', 'Pincode', 'Village'] },
            { pay: 45000, profit: 255000, credit: 300000, visibleFor: ['Tehsil', 'Pincode', 'Village'] },
            { pay: 30000, profit: 170000, credit: 200000, visibleFor: ['Pincode', 'Village'] },
            { pay: 15000, profit: 85000, credit: 100000, visibleFor: ['Village'] }
        ];

        // Load plans on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadPaymentPlans();
        });

        async function loadPaymentPlans() {
            try {
                const response = await fetch(`${API_BASE_URL}/admin/payment-plans`);
                if (response.ok) {
                    const data = await response.json();
                    // Handle both old format (object with levels) and new format (array)
                    if (Array.isArray(data.paymentPlans)) {
                        paymentPlans = data.paymentPlans;
                    } else if (data.paymentPlans) {
                        // Convert old format to new format (remove duplicates)
                        paymentPlans = convertOldFormatToNew(data.paymentPlans);
                    }
                    console.log('✅ Payment plans loaded:', paymentPlans);
                }
            } catch (error) {
                console.log('Using default payment plans');
            }
            renderAllPlans();
        }

        // Convert old format (object with levels) to new format (single array)
        function convertOldFormatToNew(oldFormat) {
            const allPlans = [];
            const seenPlans = new Map();
            
            allLevels.forEach(level => {
                if (oldFormat[level]) {
                    oldFormat[level].forEach(plan => {
                        const key = `${plan.pay}-${plan.profit}-${plan.credit}`;
                        if (seenPlans.has(key)) {
                            // Plan already exists, add this level to visibleFor
                            const existingPlan = seenPlans.get(key);
                            if (!existingPlan.visibleFor.includes(level)) {
                                existingPlan.visibleFor.push(level);
                            }
                        } else {
                            // New unique plan
                            const newPlan = {
                                pay: plan.pay,
                                profit: plan.profit,
                                credit: plan.credit,
                                visibleFor: plan.visibleFor || [level]
                            };
                            allPlans.push(newPlan);
                            seenPlans.set(key, newPlan);
                        }
                    });
                }
            });
            
            return allPlans;
        }

        function renderAllPlans() {
            const container = document.getElementById('all-plans');
            if (!container) return;
            container.innerHTML = paymentPlans.map((plan, index) => createPlanCard(plan, index)).join('');
        }

        function createPlanCard(plan, index) {
            if (!plan.visibleFor) plan.visibleFor = allLevels;

            const checkboxes = allLevels.map(loc => {
                const checked = plan.visibleFor.includes(loc) ? 'checked' : '';
                return `
                    <label class="visibility-check">
                        <input type="checkbox" ${checked} onchange="toggleVisibility(${index}, '${loc}', this.checked)">
                        <span>${loc}</span>
                    </label>
                `;
            }).join('');

            return `
                <div class="col-md-6 col-lg-4">
                    <div class="plan-card">
                        <div class="plan-number">${index + 1}</div>
                        
                        <!-- Investment Amount -->
                        <div class="investment-section">
                            <div class="investment-label">Investment Amount</div>
                            <input type="text" class="investment-input" 
                                   value="₹${(plan.pay / 1000).toFixed(0)}K" 
                                   onfocus="this.value='${plan.pay}'" 
                                   onblur="updatePayAmount(${index}, this)"
                                   onchange="updatePayAmount(${index}, this)">
                            <small style="font-size: 11px; color: #6c757d;">One-time payment</small>
                        </div>

                        <!-- Benefits -->
                        <div class="benefits-grid">
                            <!-- Profit -->
                            <div class="benefit-box profit">
                                <div class="benefit-header">
                                    <div class="benefit-icon profit">
                                        <i class="fas fa-chart-line"></i>
                                    </div>
                                    <div>
                                        <div class="benefit-label">Commission</div>
                                        <div class="benefit-sublabel">(85%)</div>
                                    </div>
                                </div>
                                <div class="benefit-value">
                                    <input type="text" 
                                           value="₹${(plan.profit / 1000).toFixed(0)}K" 
                                           onfocus="this.value='${plan.profit}'" 
                                           onblur="updateProfitAmount(${index}, this)"
                                           onchange="updateProfitAmount(${index}, this)">
                                </div>
                            </div>

                            <!-- Credits -->
                            <div class="benefit-box credits">
                                <div class="benefit-header">
                                    <div class="benefit-icon credits">
                                        <i class="fas fa-ad"></i>
                                    </div>
                                    <div>
                                        <div class="benefit-label">Ad Credits</div>
                                        <div class="benefit-sublabel">(100%)</div>
                                    </div>
                                </div>
                                <div class="benefit-value">
                                    <input type="text" 
                                           value="₹${(plan.credit / 1000).toFixed(0)}K" 
                                           onfocus="this.value='${plan.credit}'" 
                                           onblur="updateCreditAmount(${index}, this)"
                                           onchange="updateCreditAmount(${index}, this)">
                                </div>
                            </div>
                        </div>

                        <!-- Visibility Controls -->
                        <div class="visibility-section">
                            <div class="visibility-header">
                                <i class="fas fa-eye me-2"></i>Visible For These Locations
                            </div>
                            <div class="visibility-checkboxes">
                                ${checkboxes}
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="action-buttons">
                            <button class="btn btn-remove" onclick="removePlan(${index})">
                                <i class="fas fa-trash me-2"></i>Remove Plan
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updatePayAmount(index, input) {
            const value = parseInt(input.value.replace(/[^0-9]/g, ''));
            paymentPlans[index].pay = value;
            input.value = `₹${(value / 1000).toFixed(0)}K`;
            console.log(`Updated plan ${index + 1} payment:`, value);
        }

        function updateProfitAmount(index, input) {
            const value = parseInt(input.value.replace(/[^0-9]/g, ''));
            paymentPlans[index].profit = value;
            input.value = `₹${(value / 1000).toFixed(0)}K`;
            console.log(`Updated plan ${index + 1} profit:`, value);
        }

        function updateCreditAmount(index, input) {
            const value = parseInt(input.value.replace(/[^0-9]/g, ''));
            paymentPlans[index].credit = value;
            input.value = `₹${(value / 1000).toFixed(0)}K`;
            console.log(`Updated plan ${index + 1} credit:`, value);
        }

        function toggleVisibility(index, location, isChecked) {
            if (!paymentPlans[index].visibleFor) {
                paymentPlans[index].visibleFor = [];
            }

            if (isChecked) {
                if (!paymentPlans[index].visibleFor.includes(location)) {
                    paymentPlans[index].visibleFor.push(location);
                }
            } else {
                paymentPlans[index].visibleFor = paymentPlans[index].visibleFor.filter(l => l !== location);
            }

            console.log(`Plan ${index + 1} visibility:`, paymentPlans[index].visibleFor);
        }

        function addPlan() {
            paymentPlans.push({
                pay: 30000,
                profit: 170000,
                credit: 200000,
                visibleFor: allLevels
            });
            renderAllPlans();
            showNotification(`New plan added successfully`, 'success');
        }

        function removePlan(index) {
            if (paymentPlans.length === 1) {
                showNotification('Cannot remove the last plan. At least one plan must exist.', 'error');
                return;
            }
            if (confirm('Remove this payment plan?')) {
                paymentPlans.splice(index, 1);
                renderAllPlans();
                showNotification('Plan removed successfully', 'success');
            }
        }

        async function saveAllPlans() {
            if (!confirm('Save all payment plan changes? This will update the channel partner application form immediately.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/admin/payment-plans`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentPlans })
                });

                if (response.ok) {
                    showNotification('✅ Payment plans saved successfully! Changes are now live.', 'success');
                } else {
                    throw new Error('Failed to save');
                }
            } catch (error) {
                console.error('Save error:', error);
                showNotification('❌ Failed to save payment plans. Please try again.', 'error');
            }
        }

        function showNotification(message, type = 'info') {
            const alertClass = type === 'success' ? 'alert-success' : type === 'error' ? 'alert-danger' : 'alert-info';
            const alert = document.createElement('div');
            alert.className = `alert ${alertClass} position-fixed top-0 start-50 translate-middle-x mt-3`;
            alert.style.zIndex = '9999';
            alert.style.minWidth = '400px';
            alert.innerHTML = `
                <strong>${message}</strong>
                <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>
            `;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        function logout() {
            if (confirm('Logout?')) {
                localStorage.removeItem('channelPartnerToken');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
